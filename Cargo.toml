[package]
name = "godrays"
version = "0.1.0"
edition = "2021"
description = "Godrays: a couch-friendly game-streaming launcher built on Kyber"
license = "MIT"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
gilrs = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
directories = "5"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
sha2 = "0.10"
getrandom = "0.2"
serde_json = "1"
spake2 = "0.4"
chacha20poly1305 = "0.10"
mdns-sd = "0.22"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_Graphics_Gdi",
    "Wdk_Graphics_Direct3D",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
